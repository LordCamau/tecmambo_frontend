<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp Plus Kenya price and payment guide</title>
  <desc id="desc">A tecMAMBO guide showing the locally observed KSh 119 monthly price, variable trial availability and app store payment caveats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#dcefe4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#315845" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 740C290 620 500 860 820 720s510-10 780-160v340H0z" fill="#159968" opacity=".12"/>
  <text x="90" y="94" fill="#14764f" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">TECMAMBO ORIGINAL</text>
  <text x="90" y="166" fill="#10261b" font-family="Arial, sans-serif" font-size="60" font-weight="800">WhatsApp Plus in Kenya</text>
  <text x="90" y="214" fill="#496157" font-family="Arial, sans-serif" font-size="28">Check the exact price, trial and payment options shown in your own app.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="280" width="620" height="470" rx="42" fill="#0b2118"/>
    <rect x="760" y="280" width="750" height="470" rx="42" fill="#ffffff"/>
  </g>
  <text x="150" y="365" fill="#7be2b3" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">LOCALLY OBSERVED</text>
  <text x="150" y="495" fill="#ffffff" font-family="Arial, sans-serif" font-size="110" font-weight="900">KSh 119</text>
  <text x="154" y="550" fill="#d8e5df" font-family="Arial, sans-serif" font-size="34">per month during rollout</text>
  <line x1="150" y1="604" x2="650" y2="604" stroke="#365346" stroke-width="2"/>
  <text x="150" y="654" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Price can vary by account and platform.</text>
  <text x="150" y="700" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">A free trial is not guaranteed.</text>

  <text x="830" y="365" fill="#10261b" font-family="Arial, sans-serif" font-size="38" font-weight="800">How billing works</text>
  <circle cx="850" cy="438" r="18" fill="#159968"/>
  <text x="890" y="447" fill="#20352b" font-family="Arial, sans-serif" font-size="29" font-weight="700">Android: Google Play billing</text>
  <circle cx="850" cy="510" r="18" fill="#159968"/>
  <text x="890" y="519" fill="#20352b" font-family="Arial, sans-serif" font-size="29" font-weight="700">iPhone: App Store billing</text>
  <circle cx="850" cy="582" r="18" fill="#159968"/>
  <text x="890" y="591" fill="#20352b" font-family="Arial, sans-serif" font-size="29" font-weight="700">M-PESA Xpress is listed in Kenya</text>
  <circle cx="850" cy="654" r="18" fill="#f0a83a"/>
  <text x="890" y="663" fill="#20352b" font-family="Arial, sans-serif" font-size="29" font-weight="700">Availability can vary for subscriptions</text>
  <rect x="830" y="700" width="600" height="52" rx="26" fill="#e2f4eb"/>
  <text x="1130" y="735" text-anchor="middle" fill="#126c48" font-family="Arial, sans-serif" font-size="23" font-weight="800">VERIFY BEFORE YOU SUBSCRIBE</text>

  <text x="800" y="840" text-anchor="middle" fill="#4b6258" font-family="Arial, sans-serif" font-size="23">This is an editorial guide, not an official receipt or permanent price guarantee.</text>
</svg>
