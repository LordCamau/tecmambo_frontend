<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Safaricom board reshuffle</title>
  <desc id="desc">Corporate graphic naming Mariam Cassim and Matimba Mbungela as incoming Safaricom non-executive directors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061c13"/>
      <stop offset="0.52" stop-color="#0b5b38"/>
      <stop offset="1" stop-color="#a50b1b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#27d17f"/>
      <stop offset="1" stop-color="#ff3853"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="100" r="330" fill="#fff" opacity="0.04"/>
  <circle cx="135" cy="820" r="280" fill="#fff" opacity="0.04"/>
  <rect x="100" y="86" width="1400" height="728" rx="42" fill="#06130e" opacity="0.72" stroke="#fff" stroke-opacity="0.14"/>
  <text x="160" y="190" fill="#9cf4c4" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="5">SAFARICOM BOARD</text>
  <text x="160" y="308" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">Majority ownership</text>
  <text x="160" y="402" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">moves into governance</text>
  <rect x="160" y="455" width="1280" height="8" rx="4" fill="url(#line)"/>
  <g transform="translate(160 520)">
    <rect width="595" height="205" rx="28" fill="#fff" fill-opacity="0.08" stroke="#42dc91" stroke-opacity="0.62"/>
    <text x="38" y="64" fill="#85efb7" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">INCOMING NON-EXECUTIVE DIRECTOR</text>
    <text x="38" y="124" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800">Mariam Cassim</text>
    <text x="38" y="168" fill="#dbe9e2" font-family="Arial, Helvetica, sans-serif" font-size="25">Vodacom Fintech Group &amp; Partnerships</text>
  </g>
  <g transform="translate(845 520)">
    <rect width="595" height="205" rx="28" fill="#fff" fill-opacity="0.08" stroke="#ff647a" stroke-opacity="0.72"/>
    <text x="38" y="64" fill="#ff9cab" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">INCOMING NON-EXECUTIVE DIRECTOR</text>
    <text x="38" y="124" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800">Matimba Mbungela</text>
    <text x="38" y="168" fill="#dbe9e2" font-family="Arial, Helvetica, sans-serif" font-size="25">Vodacom Group Human Resources</text>
  </g>
  <text x="160" y="776" fill="#c9d9d0" font-family="Arial, Helvetica, sans-serif" font-size="24">Effective 13 August 2026, subject to regulatory approvals</text>
</svg>
